<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal-ka Xaadirinta Ardayda</title>
    <!-- Soo rishada SheetJS si aan Excel u akhrino -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .file-upload, .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 5px;
            text-align: center;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #27ae60;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #219653;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #2980b9;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .status-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .xaadir { background-color: #2ecc71; color: white; }
        .maqan { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal-ka Xaadirinta Ardayda</h1>
    
    <!-- Qaybta Excel-ka laga soo gelinayo -->
    <div class="file-upload">
        <label for="excel-file"><b>Soo geli feylka Excel (Ardayda):</b> </label>
        <input type="file" id="excel-file" accept=".xlsx, .xls">
    </div>

    <!-- Qaybta Xulashada Fasalka iyo Taariikhda -->
    <div class="controls" id="controls-section" style="display: none;">
        <label for="class-select">Fasalka: </label>
        <select id="class-select" onchange="muujiArdayda()"></select>

        <label for="date-input">Taariikhda: </label>
        <input type="date" id="date-input" style="padding: 8px;">

        <button onclick="sooDagsoExcel()">La soo deg Xaadirinta (Excel)</button>
    </div>

    <!-- Shaxda Ardayda -->
    <table id="attendance-table" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Magaca Ardayda</th>
                <th>Fasalka</th>
                <th>Xaaladda (Xaadir/Maqan)</th>
            </tr>
        </thead>
        <tbody id="student-list">
            <!-- Xogta ardayda halkan ayaa ku dhex rimi doonta -->
        </tbody>
    </table>
</div>

<script>
    let xogtaHore = []; // Halkan waxaa ku kejdismaya xogta excel-ka
    let fasalada = [];

    // Akhrinta feylka Excel markii la soo geliyo
    document.getElementById('excel-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            
            // Waxaan u qaadanaynaa in xogtu ku jirto Sheet-ka ugu horeeya
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            
            // U bedel xogta Excel qaab JSON ah
            xogtaHore = XLSX.utils.sheet_to_json(sheet);
            
            if(xogtaHore.length > 0) {
                hagaajiFasalada();
                document.getElementById('controls-section').style.display = 'block';
                document.getElementById('attendance-table').style.display = 'table';
            } else {
                alert("Feylku waa madhan yahay ama qaabku waa khaldan yahay!");
            }
        };
        reader.readAsBinaryString(file);
    });

    // Soo saarista fasalada kala duwan ee feylka ku jira
    function hagaajiFasalada() {
        const classSelect = document.getElementById('class-select');
        classSelect.innerHTML = '';
        
        // Hel fasalada u gaarka ah (Unique classes)
        const uniqueClasses = [...new Set(xogtaHore.map(item => item.Fasalka || item.fasalka))];
        
        uniqueClasses.forEach(fasal => {
            if(fasal) {
                let option = document.createElement('option');
                option.value = fasal;
                option.textContent = fasal;
                classSelect.appendChild(option);
            }
        });
        
        // Deji taariikhda maanta si toos ah
        document.getElementById('date-input').valueAsDate = new Date();
        
        muujiArdayda();
    }

    // Muujinta ardayda marka fasal la doorto
    function muujiArdayda() {
        const selectedClass = document.getElementById('class-select').value;
        const studentList = document.getElementById('student-list');
        studentList.innerHTML = '';

        // Sifee ardayda ku jirta fasalka la doorto
        const ardaydaFasalka = xogtaHore.filter(item => (item.Fasalka || item.fasalka) == selectedClass);

        ardaydaFasalka.forEach((arday, index) => {
            // Haddii aanay xaalad hore u lahaan, u deji 'Xaadir'
            if (!arday.Xaaladda) arday.Xaaladda = "Xaadir";

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${arday.ID || arday.id || (index + 1)}</td>
                <td>${arday.Magaca || arday.magaca || arday.Name}</td>
                <td>${selectedClass}</td>
                <td>
                    <button class="status-btn ${arday.Xaaladda == 'Xaadir' ? 'xaadir' : 'maqan'}" 
                            onclick="bedelXaaladda(this, ${xogtaHore.indexOf(arday)})">
                        ${arday.Xaaladda}
                    </button>
                </td>
            `;
            studentList.appendChild(tr);
        });
    }

    // Badalka badanka Xaadir/Maqan
    function bedelXaaladda(btn, globalIndex) {
        if (xogtaHore[globalIndex].Xaaladda === "Xaadir") {
            xogtaHore[globalIndex].Xaaladda = "Maqan";
            btn.textContent = "Maqan";
            btn.className = "status-btn maqan";
        } else {
            xogtaHore[globalIndex].Xaaladda = "Xaadir";
            btn.textContent = "Xaadir";
            btn.className = "status-btn xaadir";
        }
    }

    // Dib u dhoofinta xogta xaadirinta oo Excel ah
    function sooDagsoExcel() {
        const taariikhda = document.getElementById('date-input').value || 'maanta';
        const fasalka = document.getElementById('class-select').value;
        
        // Ku dar taariikhda xogta la soo dejisanayo
        const xogtaLaDhoofinayo = xogtaHore.map(item => {
            let niyan = {...item};
            niyan.Taariikhda = taariikhda;
            return niyan;
        });

        const worksheet = XLSX.utils.json_to_sheet(xogtaLaDhoofinayo);
        const workbook = XLSX.utils.book_new();
        XLSX.book_append_sheet(workbook, worksheet, "Xaadirinta");

        // Magaca feylka la soo degayo
        XLSX.writeFile(workbook, `Xaadirinta_${fasalka}_${taariikhda}.xlsx`);
    }
</script>

</body>
</html>
