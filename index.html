<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaadirinta Macalimiinta - GitHub Pages</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --bg-color: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 30px;
        }

        h2, h3 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--secondary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        /* Shaxda Xogta */
        .table-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-jooga { background-color: #2ecc71; }
        .badge-majoogo { background-color: #e74c3c; }
        .badge-soodaahay { background-color: #f39c12; }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            float: right;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Xaadiriska Macalimiinta</h2>
    <form id="attendanceForm">
        <div class="form-group">
            <label for="teacherName">Magaca Macalinka</label>
            <select id="teacherName" required>
                <option value="">Dooro Magacaaga...</option>
                <option value="Aways Cali">Aways Cali</option>
                <option value="Faadumo Axmed">Faadumo Axmed</option>
                <option value="Maxamed Cumar">Maxamed Cumar</option>
                <option value="Saciid Xasan">Saciid Xasan</option>
            </select>
        </div>

        <div class="form-group">
            <label for="attDate">Taariikhda</label>
            <input type="date" id="attDate" required>
        </div>

        <div class="form-group">
            <label for="status">Xaalada Xaadirista</label>
            <select id="status" required>
                <option value="Jooga">Jooga (Present)</option>
                <option value="Ma Joogo">Ma Joogo (Absent)</option>
                <option value="Soo Daahay">Soo Daahay (Late)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Geli Xaadiriska</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<div class="table-container">
    <button class="btn-clear" onclick="clearAttendance()">Nadiifi Xogta</button>
    <h3>Liiska Macalimiinta Isxaadiriyey</h3>
    <table>
        <thead>
            <tr>
                <th>Macalinka</th>
                <th>Taariikhda</th>
                <th>Xaalada</th>
                <th>Wakhtiga la isxaadiriyey</th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Xogta halkaan ayay ku dhex darsami doontaa -->
        </tbody>
    </table>
</div>

<script>
    // Toos u geli taariikhda maanta foomka
    document.getElementById('attDate').valueAsDate = new Date();

    // Marka bogga la furo, soo bandhig xogta horey u kaydsan
    document.addEventListener('DOMContentLoaded', displayAttendance);

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('teacherName').value;
        const date = document.getElementById('attDate').value;
        const status = document.getElementById('status').value;
        const timeNow = new Date().toLocaleTimeString();

        const newAttendance = {
            teacherName: name,
            date: date,
            status: status,
            time: timeNow
        };

        // Ka soo qaado xogta horey u jirtay LocalStorage ama abuur liis cusub [2]
        let attendanceList = localStorage.getItem('schoolAttendance') ? JSON.parse(localStorage.getItem('schoolAttendance')) : [];
        
        // Ku dar xogta cusub
        attendanceList.push(newAttendance);
        
        // Dib ugu kaydi LocalStorage [2]
        localStorage.setItem('schoolAttendance', JSON.stringify(attendanceList));

        // Muujinta fariinta guusha
        const msgDiv = document.getElementById('responseMessage');
        msgDiv.textContent = `Waa laguu diwangeliyey ${name}!`;
        msgDiv.className = "message success";

        // Cusboonaysii shaxda
        displayAttendance();

        // Dib u bixi foomka
        document.getElementById('attendanceForm').reset();
        document.getElementById('attDate').valueAsDate = new Date();

        // Qari fariinta guusha 3 seko ka dib
        setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
    });

    // Shaqada soo bandhigaysa xogta shaxda dhexdeeda
    function displayAttendance() {
        const tableBody = document.getElementById('attendanceTableBody');
        tableBody.innerHTML = '';

        let attendanceList = localStorage.getItem('schoolAttendance') ? JSON.parse(localStorage.getItem('schoolAttendance')) : [];

        attendanceList.forEach(item => {
            const row = document.createElement('tr');
            
            let badgeClass = 'badge-jooga';
            if(item.status === 'Ma Joogo') badgeClass = 'badge-majoogo';
            if(item.status === 'Soo Daahay') badgeClass = 'badge-soodaahay';

            row.innerHTML = `
                <td>${item.teacherName}</td>
                <td>${item.date}</td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td>${item.time}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // Shaqada masaxaysa xogta oo dhan
    function clearAttendance() {
        if(confirm("Ma hubtaa inaad rabto inaad tirtirto dhamaan xogta xaadiriska?")) {
            localStorage.removeItem('schoolAttendance');
            displayAttendance();
        }
    }
</script>

</body>
</html>
