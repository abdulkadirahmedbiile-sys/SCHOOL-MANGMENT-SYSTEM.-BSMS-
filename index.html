<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaadirinta Macalimiinta</title>
    <style>
        body { font-family: sans-serif; background: #f5f6fa; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 0; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select, input { width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: #3498db; color: white; }
        .btn-dark { background: #2c3e50; color: white; }
        .msg { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; display: none; font-weight: bold; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        
        /* Sanduuqa Gudaha ee Password-ka (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-red { background: #e74c3c; color: white; }

        .view { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 600px; display: none; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>Xaadiriska Macalimiinta</h2>
    <form id="f">
        <div class="group">
            <label>Magaca Macalinka</label>
            <select id="n" required>
                <option value="">Dooro...</option>
                <option value="Axmed Abdulkadir biile ">Axmed Abdulkadir biile</option>
                <option value="Maxamed Abdurasak suufi">Maxamed Abdurasak suufi</option>
                <option value="Maxamed Axmed Uurcad">Maxamed Axmed Uurcad</option>
                 <option value="Maxamed Cabdi Oog">Maxamed Cabdi Oog</option>
                 <option value="Khaalid">Khaalid</option>
                 <option value="Faarax ciise Faarax">Faarax ciise Faarax</option>
                 <option value="Iimaan Xasan Maxaamed">Iimaan Xasan Maxaamed</option>
            </select>
        </div>
        <div class="group"><label>Taariikhda</label><input type="date" id="d" required readonly></div>
        <div class="group">
            <label>Xaalada</label>
            <select id="s" required>
                <option value="Jooga">Jooga</option>
                <option value="Ma Joogo">Ma Joogo</option>
                <option value="Soo Daahay">Soo Daahay</option>
            </select>
        </div>
        <button type="submit" class="btn-blue">Is xaadiri</button>
    </form>
    <div id="m" class="msg"></div>
    <button class="btn-dark" onclick="openModal()">🔒 Qaybta Admin-ka</button>
</div>

<!-- Sanduuqa Login-ka ee gudihiisa ah -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>Gasho Password-ka</h3>
        <input type="password" id="passInput" placeholder="Ereyga sirta ah...">
        <div id="modalErr" class="msg error" style="margin-bottom: 10px;"></div>
        <div class="modal-btns">
            <button class="btn-blue" onclick="checkAdmin()">Gasho</button>
            <button class="btn-red" onclick="closeModal()">Xidh</button>
        </div>
    </div>
</div>

<div class="view" id="a">
    <h3>Xogta Xaadiriska (Admin)</h3>
    <table>
        <thead><tr><th>Macalinka</th><th>Taariikhda</th><th>Xaalada</th><th>Wakhtiga</th></tr></thead>
        <tbody id="b"></tbody>
    </table>
</div>

<script>
    document.getElementById('d').valueAsDate = new Date();
    show();

    // Hubinta Waqtiga (16:00 pm ilaa 07:30 AM)
    const now = new Date(), min = (now.getHours() * 60) + now.getMinutes();
    if (min < 420 || min > 450) {
        const m = document.getElementById('m');
        m.textContent = "Waqtiga diiwaangelintu waa 07:00 ilaa 07:30 subaxnimo.";
        m.className = "msg error";
    }

    document.getElementById('f').addEventListener('submit', (e) => {
        e.preventDefault();
        const item = { name: document.getElementById('n').value, date: document.getElementById('d').value, status: document.getElementById('s').value, time: new Date().toLocaleTimeString() };
        let list = localStorage.getItem('att') ? JSON.parse(localStorage.getItem('att')) : [];
        list.push(item);
        localStorage.setItem('att', JSON.stringify(list));
        
        const m = document.getElementById('m');
        m.textContent = `Waa la kaydiyey xogta ${item.name}!`;
        m.className = "msg success";
        show();
        document.getElementById('f').reset();
        document.getElementById('d').valueAsDate = new Date();
        setTimeout(() => m.style.display = 'none', 3000);
    });

    function show() {
        const b = document.getElementById('b'); b.innerHTML = '';
        let list = localStorage.getItem('att') ? JSON.parse(localStorage.getItem('att')) : [];
        list.forEach(i => {
            b.innerHTML += `<tr><td>${i.name}</td><td>${i.date}</td><td>${i.status}</td><td>${i.time}</td></tr>`;
        });
    }

    // Shaqooyinka Sanduuqa Gudaha (Internal Login)
    function openModal() {
        document.getElementById('loginModal').style.display = "flex";
        document.getElementById('passInput').focus();
    }
    function closeModal() {
        document.getElementById('loginModal').style.display = "none";
        document.getElementById('passInput').value = "";
        document.getElementById('modalErr').style.display = "none";
    }
    function checkAdmin() {
        const pass = document.getElementById('passInput').value;
        const err = document.getElementById('modalErr');
        if (pass === "Admin123") {
            closeModal();
            document.getElementById('a').style.display = "block";
            document.getElementById('a').scrollIntoView({ behavior: 'smooth' });
        } else {
            err.textContent = "Password-ku waa khaldan yahay!";
            err.style.display = "block";
        }
    }
</script>

</body>
</html>
