<!DOCTYPE html>
<html lang="so">
<head>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-slate-50 font-sans text-slate-800 text-xs">
    <!-- BOGGA 1: LOGIN -->
    <div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 to-slate-900 px-4">
        <form onsubmit="event.preventDefault(); if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin'){document.getElementById('login-page').className='hidden';document.getElementById('dash').className='min-h-screen flex';}else{alert('Khalad!')}" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm space-y-4">
            <h2 class="text-lg font-bold text-center">Maamulka Schoolka</h2>
            <div><label>Username</label><input type="text" id="u" class="w-full p-2 border rounded-xl" placeholder="admin"></div>
            <div><label>Password</label><input type="password" id="p" class="w-full p-2 border rounded-xl" placeholder="••••"></div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">Gasho Portal-ka</button>
        </form>
    </div>
    <!-- BOGGA 2: DASHBOARD -->
    <div id="dash" class="hidden">
        <aside class="w-56 bg-slate-900 text-slate-300 flex flex-col p-4 space-y-4 shrink-0">
            <h2 class="font-bold text-white border-b border-slate-800 pb-2">SMS PORTAL</h2>
            <div class="space-y-1">
                <button onclick="load('Form 4')" class="w-full text-left p-2 rounded-lg hover:bg-slate-800"><i class="fa-solid fa-folder"></i> Form 4</button>
                <button onclick="load('Grade 5')" class="w-full text-left p-2 rounded-lg hover:bg-slate-800"><i class="fa-solid fa-folder"></i> Grade 5</button>
            </div>
            <button onclick="location.reload()" class="bg-red-950 text-red-400 p-2 rounded-lg mt-auto font-bold">Ka Bax</button>
        </aside>
        <main class="flex-1 p-6 space-y-6">
            <h2 id="title" class="text-xl font-bold text-slate-900">Ku soo dhawaada Portal-ka Maamulka</h2>
            <div id="view" class="hidden space-y-6">
                <!-- Form Master -->
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-xl p-4 text-white grid grid-cols-2 gap-2">
                    <div>Macallinka: <strong id="fm-n"></strong></div>
                    <div>Maaddada: <strong id="fm-s"></strong></div>
                </div>
                <!-- Qorista Ardayda -->
                <form onsubmit="addS(event)" class="bg-white p-4 rounded-xl border grid grid-cols-4 gap-2">
                    <input type="text" id="n-n" required class="p-2 border rounded-lg" placeholder="Magaca Buuxa">
                    <select id="n-g" class="p-2 border rounded-lg"><option>Lab</option><option>Dheddig</option></select>
                    <input type="text" id="n-c" required class="p-2 border rounded-lg" placeholder="Tel Waalidka">
                    <button type="submit" class="bg-emerald-600 text-white rounded-lg font-bold">Keydi Ardayga</button>
                </form>
                <!-- Shaxda Record-ka -->
                <div class="bg-white rounded-xl border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr><th class="p-3">ID</th><th class="p-3">Magaca</th><th class="p-3">Jinsiga</th><th class="p-3">Waalidka</th></tr>
                        </thead>
                        <tbody id="tbody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        let curClass = "";
        const db = {
            "Form 4": { fm: { n: "Cabdullaahi Jaamac", s: "Physics" }, sts: [{ id: 101, n: "Axmed Yuusuf", g: "Lab", c: "6155511" }] },
            "Grade 5": { fm: { n: "Aamina Maxamuud", s: "Af-Soomaali" }, sts: [{ id: 201, n: "Mustafe Yaasiin", g: "Lab", c: "6198765" }] }
        };
        function load(cls) {
            curClass = cls;
            document.getElementById('title').innerText = `Kaydka Xogta — ${cls}`;
            document.getElementById('view').className = 'space-y-6';
            document.getElementById('fm-n').innerText = db[cls].fm.n;
            document.getElementById('fm-s').innerText = db[cls].fm.s;
            const tb = document.getElementById('tbody');
            tb.innerHTML = '';
            db[cls].sts.forEach(s => {
                tb.innerHTML += `<tr><td class="p-3 font-mono">#${s.id}</td><td class="p-3 font-bold">${s.n}</td><td class="p-3">${s.g}</td><td class="p-3">${s.c}</td></tr>`;
            });
        }
        function addS(e) {
            e.preventDefault();
            const n = document.getElementById('n-n'), g = document.getElementById('n-g'), c = document.getElementById('n-c');
            db[curClass].sts.push({ id: Math.floor(100 + Math.random()*900), n: n.value, g: g.value, c: c.value });
            load(curClass);
            n.value = ''; c.value = '';
        }
    </script>
</body>
</html>
