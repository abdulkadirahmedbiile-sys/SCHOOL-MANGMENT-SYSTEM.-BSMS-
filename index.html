<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xog Ururin Fudud</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Foomka Ururinta Xogta</h2>
        
        <!-- Foomka wuxuu toos xogta ugu dirayaa Formspree (Ku beddel emailkaaga hoos) -->
        <form id="surveyForm" action="https://formspree.io" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Magacaaga:</label>
                <input type="text" name="Magaca" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Telefankaaga:</label>
                <input type="tel" name="Telefanka" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Fikirkaaga ku saabsan adeegga:</label>
                <textarea name="Fikirka" rows="3" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Halkan ku qor..."></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">Gudbi Jawaabta</button>
        </form>

        <!-- Farriinta guusha -->
        <div id="status" class="hidden text-center text-green-600 font-medium pt-4">Jawaabtaada si guul leh ayaa loo diray!</div>
    </div>

    <script>
        const form = document.getElementById("surveyForm");
        const status = document.getElementById("status");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = new FormData(form);
            
            // Xogta waxaa loo dirayaa endpoint-ka si toos ah
            const response = await fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                form.reset();
                form.classList.add("hidden");
                status.classList.remove("hidden");
            } else {
                alert("Waa uu guuldarraystay gudbinta foomku. Fadlan dib u tijaabi.");
            }
        });
    </script>
</body>
</html>
