<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaadirinta Macalimiinta - GitHub Pages</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            margin-bottom: 30px;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer; /* Waxay tusaysaa in la gujin karo */
            user-select: none;
        }

        h3 {
            color: var(--primary-color);
            text-align: center;
        }

        .time-banner {
            background-color: #e8f4fd;
            border-left: 4px solid var(--secondary-color);
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: var(--primary-color);
            text-align: center;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--secondary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .btn-submit:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }

        /* Qaybta Admin-ka (Marka hore waa qosoon tahay) */
        .table-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            overflow-x: auto;
            display: none; /* Qari shaxda */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-jooga { background-color: #2ecc71; }
        .badge-majoogo { background-color: #e74c3c; }
        .badge-soodaahay { background-color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <!-- Halkan riix si aad u gasho Password-ka Admin-ka -->
    <h2 onclick="openAdminPanel()">Xaadiriska Macalimiinta</h2>
    
    <div class="time-banner">
        🕒 Waqtiga Xaadiriska: 07:00 AM ilaa 07:30 AM
    </div>

    <form id="attendanceForm">
        <div class="form-group">
            <label for="teacherName">Magaca Macalinka</label>
            <select id="teacherName" required>
                <option value="">Dooro Magacaaga...</option>
                <option value="Aways Cali">Aways Cali</option>
                <option value="Faadumo Axmed">Faadumo Axmed</option>
                <option value="Maxamed Cumar">Maxamed Cumar</option>
                <option value="Saciid Xasan">Saciid Xasan</option>
            </select>
        </div>

        <div class="form-group">
            <label for="attDate">Taariikhda</label>
            <input type="date" id="attDate" required readonly>
        </div>

        <div class="form-group">
            <label for="status">Xaalada Xaadirista</label>
            <select id="status" required>
                <option value="Jooga">Jooga (Present)</option>
                <option value="Ma Joogo">Ma Joogo (Absent)</option>
                <option value="Soo Daahay">Soo Daahay (Late)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Geli Xaadiriska</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<!-- Shaxda Xogta ee Admin-ka Kaliya -->
<div class="table-container" id="adminPanel">
    <h3>Liiska Xogta Xaadiriska (Admin Only)</h3>
    <table>
        <thead>
            <tr>
                <th>Macalinka</th>
                <th>Taariikhda</th>
                <th>Xaalada</th>
                <th>Wakhtiga la isxaadiriyey</th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Xogta halkan ayay ku dhex darsami doontaa -->
        </tbody>
    </table>
</div>

<script>
    // Toos u geli taariikhda maanta foomka
    document.getElementById('attDate').valueAsDate = new Date();

    // Hubi waqtiga marka bogga la furo
    document.addEventListener('DOMContentLoaded', () => {
        checkTimeRestrictions();
        displayAttendance();
    });

    // Shaqada xaddidaysa waqtiga (07:00 AM ilaa 07:30 AM)
    function checkTimeRestrictions() {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const submitBtn = document.getElementById('submitBtn');
        const msgDiv = document.getElementById('responseMessage');

        // Beddel waqtiga guud ahaan daqiiqado si loo xisaabiyo (7:00 = 420 daqiiqo, 7:30 = 450 daqiiqo)
        const totalMinutes = (currentHour * 60) + currentMinute;
        const startLimit = (7 * 60) + 0;   // 07:00
        const endLimit = (7 * 60) + 30;   // 07:30

        if (totalMinutes < startLimit || totalMinutes > endLimit) {
            submitBtn.disabled = true;
            msgDiv.textContent = "Waqtiga xaadiriska waa la xidhay! (Wuxuu furanyahay 07:00 AM ilaa 07:30 AM oo kaliya)";
            msgDiv.className = "message error";
            return false;
        }
        
        submitBtn.disabled = false;
        return true;
    }

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!checkTimeRestrictions()) return;

        const name = document.getElementById('teacherName').value;
        const date = document.getElementById('attDate').value;
        const status = document.getElementById('status').value;
        const timeNow = new Date().toLocaleTimeString();

        const newAttendance = {
            teacherName: name,
            date: date,
            status: status,
            time: timeNow
        };

        let attendanceList = localStorage.getItem('schoolAttendance') ? JSON.parse(localStorage.getItem('schoolAttendance')) : [];
        attendanceList.push(newAttendance);
        localStorage.setItem('schoolAttendance', JSON.stringify(attendanceList));

        const msgDiv = document.getElementById('responseMessage');
        msgDiv.textContent = `Waad ku mahadsantahay isxaadirinta, ${name}!`;
        msgDiv.className = "message success";

        displayAttendance();

        document.getElementById('attendanceForm').reset();
        document.getElementById('attDate').valueAsDate = new Date();

        setTimeout(() => { 
            msgDiv.style.display = 'none';
            checkTimeRestrictions(); 
        }, 3000);
    });

    function displayAttendance() {
        const tableBody = document.getElementById('attendanceTableBody');
        tableBody.innerHTML = '';

        let attendanceList = localStorage.getItem('schoolAttendance') ? JSON.parse(localStorage.getItem('schoolAttendance')) : [];

        attendanceList.forEach(item => {
            const row = document.createElement('tr');
            
            let badgeClass = 'badge-jooga';
            if(item.status === 'Ma Joogo') badgeClass = 'badge-majoogo';
            if(item.status === 'Soo Daahay') badgeClass = 'badge-soodaahay';

            row.innerHTML = `
                <td>${item.teacherName}</td>
                <td>${item.date}</td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td>${item.time}</td>
            `;
            tableBody.appendChild(row);
// Shaqada fureysa qaybta Admin-ka marka cinwaanka la gujiyo
function openAdminPanel() {
    const password = prompt("Fadlan geli ereyga sirta ah ee Admin-ka:");
    const adminPanel = document.getElementById('adminPanel');

    if (password === "Admin123") {
        adminPanel.style.display = "block";
        alert("Waad ku guulaysatay! Xogta hadda waa kuu furan tahay.");
        // Toos u geey hoos meesha shaxdu ku taato
        adminPanel.scrollIntoView({ behavior: 'smooth' });
    } else if (password !== null) {
        alert("Ereyga sirta ah waa khaldan yahay!");
    }
}
